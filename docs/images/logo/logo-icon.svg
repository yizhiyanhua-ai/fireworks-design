<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="fireworks-design logo mark">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#e9d5ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- soft glow halo -->
  <circle cx="100" cy="100" r="60" fill="url(#core)" opacity=".55"/>

  <!-- rays: long (L=76) and short (L=50), alternating, palette-cycling -->
  <g stroke-linecap="round" stroke-width="3.6" fill="none">
    <!-- long rays -->
    <line x1="116" y1="100" x2="176" y2="100" stroke="#a855f7"/>            <!-- 0°  -->
    <line x1="138" y1="165.8" x2="108" y2="113.9" stroke="#3b82f6"/>        <!-- 60° -->
    <line x1="62"  y1="165.8" x2="92"  y2="113.9" stroke="#eab308"/>        <!-- 120°-->
    <line x1="24"  y1="100"   x2="84"  y2="100"   stroke="#a855f7"/>        <!-- 180°-->
    <line x1="62"  y1="34.2"  x2="92"  y2="86.1"  stroke="#3b82f6"/>        <!-- 240°-->
    <line x1="138" y1="34.2"  x2="108" y2="86.1"  stroke="#eab308"/>        <!-- 300°-->
    <!-- short rays -->
    <line x1="113.9" y1="108" x2="143.3" y2="125" stroke="#f97316"/>        <!-- 30° -->
    <line x1="100"   y1="116" x2="100"   y2="150" stroke="#10b981"/>        <!-- 90° -->
    <line x1="86.1"  y1="108" x2="56.7"  y2="125" stroke="#ef4444"/>        <!-- 150°-->
    <line x1="86.1"  y1="92"  x2="56.7"  y2="75"  stroke="#f97316"/>        <!-- 210°-->
    <line x1="100"   y1="84"  x2="100"   y2="50"  stroke="#10b981"/>        <!-- 270°-->
    <line x1="113.9" y1="92"  x2="143.3" y2="75"  stroke="#ef4444"/>        <!-- 330°-->
  </g>

  <!-- tip sparks (dots) -->
  <g>
    <circle cx="143.3" cy="125" r="3.4" fill="#f97316"/>
    <circle cx="100"   cy="150" r="3.4" fill="#10b981"/>
    <circle cx="56.7"  cy="125" r="3.4" fill="#ef4444"/>
    <circle cx="56.7"  cy="75"  r="3.4" fill="#f97316"/>
    <circle cx="100"   cy="50"  r="3.4" fill="#10b981"/>
    <circle cx="143.3" cy="75"  r="3.4" fill="#ef4444"/>
    <circle cx="62"    cy="165.8" r="3.4" fill="#eab308"/>
    <circle cx="138"   cy="34.2" r="3.4" fill="#eab308"/>
  </g>

  <!-- tip design-primitives: square, triangle, ring, diamond -->
  <g>
    <!-- square @ 0° (176,100) -->
    <rect x="171.5" y="95.5" width="9" height="9" rx="2" fill="#a855f7"/>
    <!-- triangle @ 120° (62,165.8) -->
    <path d="M62,160 l5.5,9.5 h-11 z" fill="#eab308"/>
    <!-- ring @ 180° (24,100) -->
    <circle cx="24" cy="100" r="5.4" fill="none" stroke="#a855f7" stroke-width="2.6"/>
    <!-- diamond @ 300° (138,34.2) -->
    <path d="M138,28.2 l6,6 -6,6 -6,-6 z" fill="#3b82f6"/>
  </g>

  <!-- bright core -->
  <circle cx="100" cy="100" r="11" fill="url(#core)"/>
  <circle cx="100" cy="100" r="5" fill="#ffffff"/>
</svg>
